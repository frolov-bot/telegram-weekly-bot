name: Manual Telegram Message

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Текст сообщения для отправки'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.GROUP_CHAT_ID }}",
            "text": "${{ inputs.message }}"
          }'
